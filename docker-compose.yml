services:
  db:
    image: postgres:16-alpine
    container_name: zai-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      POSTGRES_DB: zai_db
    volumes:
      - pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: zai-adminer
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  pgdata:
